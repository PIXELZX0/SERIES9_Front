name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Pages serves the site from https://<org>.github.io/<repo>/
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_CHAIN_ID: ${{ vars.VITE_CHAIN_ID }}
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL }}
          VITE_EXPLORER_BASE_URL: ${{ vars.VITE_EXPLORER_BASE_URL }}
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
          VITE_SER9_PROXY: ${{ vars.VITE_SER9_PROXY }}
          VITE_STAKING_PROXY: ${{ vars.VITE_STAKING_PROXY }}
          VITE_IDENTITY_PROXY: ${{ vars.VITE_IDENTITY_PROXY }}
          VITE_PERMIT2: ${{ vars.VITE_PERMIT2 }}
        run: npm run build

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
