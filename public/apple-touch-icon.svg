    <textPath href="#rim-apple" startOffset="25%">SERIES9</textPath>
    <textPath href="#rim-apple" startOffset="41.667%">SERIES9</textPath>
    <textPath href="#rim-apple" startOffset="58.333%">SERIES9</textPath>
    <textPath href="#rim-apple" startOffset="75%">SERIES9</textPath>
    <textPath href="#rim-apple" startOffset="91.667%">SERIES9</textPath>
  </text>
  <g fill="#d4af37">
    <circle cx="128" cy="22" r="2"/>
    <circle cx="219.8" cy="75" r="2"/>
    <circle cx="219.8" cy="181" r="2"/>
    <circle cx="128" cy="234" r="2"/>
    <circle cx="36.2" cy="181" r="2"/>
    <circle cx="36.2" cy="75" r="2"/>
  </g>

